name: Build macOS arm64 on Linux

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mac-build.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'desktop/**'
      - 'public/**'
      - 'skills/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    # Cross-package the unsigned Apple Silicon .app on Linux. This avoids
    # macOS-only DMG/signing steps and asks Electron's installer for the
    # darwin/arm64 runtime up front because builder.cjs uses electronDist.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_INSTALL_PLATFORM: darwin
      ELECTRON_INSTALL_ARCH: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Show runner info
        run: |
          uname -a
          uname -m
          node --version
          npm --version
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Install dependencies with macOS arm64 Electron runtime
        run: npm ci

      - name: Verify Electron runtime
        run: |
          test -d node_modules/electron/dist/Electron.app
          file node_modules/electron/dist/Electron.app/Contents/MacOS/Electron

      - name: Run tests
        run: npm test

      - name: Prepare desktop payload
        run: npm run desktop:prepare

      - name: Cross-package Apple Silicon app
        run: npx electron-builder --config desktop/builder.cjs --mac --arm64 --dir --publish never

      - name: Package app as ZIP
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          echo "App bundle: $APP"
          find "$APP/Contents/MacOS" -maxdepth 1 -type f -exec file {} \;
          VERSION="$(node -p "require('./package.json').version")"
          OUT="$GITHUB_WORKSPACE/release/DirectorDesk-${VERSION}-mac-arm64.zip"
          cd "$(dirname "$APP")"
          zip -qry --symlinks "$OUT" "$(basename "$APP")"
          cd "$GITHUB_WORKSPACE"
          ls -lh "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload macOS app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DirectorDesk-macOS-arm64-linux-cross
          path: |
            release/DirectorDesk-*-mac-arm64.zip
            release/DirectorDesk-*-mac-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
